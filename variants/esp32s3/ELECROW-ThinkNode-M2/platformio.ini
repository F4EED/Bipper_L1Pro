[env:thinknode_m2]
custom_meshtastic_hw_model = 90
custom_meshtastic_hw_model_slug = THINKNODE_M2
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = ThinkNode M2
custom_meshtastic_images = thinknode_m2.svg
custom_meshtastic_tags = Elecrow
custom_meshtastic_requires_dfu = false

extends = esp32s3_base
board = ESP32-S3-WROOM-1-N4
build_flags =
  ${esp32s3_base.build_flags}
  -D ELECROW_ThinkNode_M2
  -D GAULIX_PAGER=1
  -I variants/esp32s3/ELECROW-ThinkNode-M2

; Nœud Gaulix PC de crise (ThinkNode M2 en client USB / Wi-Fi / BLE).
; OLED SH1106 conservé (statut Meshtastic) — pas de module pager (GAULIX_PAGER).
[env:thinknode_m2-gaulix]
custom_meshtastic_hw_model = 90
custom_meshtastic_hw_model_slug = THINKNODE_M2
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Gaulix PC Crise (ThinkNode M2)
custom_meshtastic_images = thinknode_m2.svg
custom_meshtastic_tags = Elecrow,Gaulix
custom_meshtastic_requires_dfu = false

extends = esp32s3_base
board = ESP32-S3-WROOM-1-N4
board_level = extra
build_flags =
  ${esp32s3_base.build_flags}
  -D ELECROW_ThinkNode_M2
  -D GAULIX_PC_NODE=1
  -D HAS_GPS=0
  -D MESHTASTIC_EXCLUDE_GPS=1
  -UUSERPREFS_CONFIG_DEVICE_ROLE
  -DUSERPREFS_CONFIG_DEVICE_ROLE=meshtastic_Config_DeviceConfig_Role_CLIENT
  -UUSERPREFS_CONFIG_DEVICE_REBROADCAST_MODE
  -DUSERPREFS_CONFIG_DEVICE_REBROADCAST_MODE=meshtastic_Config_DeviceConfig_RebroadcastMode_LOCAL_ONLY
  -UUSERPREFS_CONFIG_GPS_MODE
  -DUSERPREFS_CONFIG_GPS_MODE=meshtastic_Config_PositionConfig_GpsMode_DISABLED
  -I variants/esp32s3/ELECROW-ThinkNode-M2
