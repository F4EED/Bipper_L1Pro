[env:seeed-xiao-s3]
custom_meshtastic_hw_model = 81
custom_meshtastic_hw_model_slug = SEEED_XIAO_S3
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = Seeed Xiao ESP32-S3
custom_meshtastic_images = seeed-xiao-s3.svg
custom_meshtastic_tags = Seeed
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 8MB

extends = esp32s3_base
board = seeed-xiao-s3
board_level = pr
board_check = true
board_build.partitions = default_8MB.csv
upload_protocol = esptool
upload_speed = 921600
build_flags = 
  ${esp32s3_base.build_flags}
  -D SEEED_XIAO_S3
  -I variants/esp32s3/seeed_xiao_s3
  -DBOARD_HAS_PSRAM 

; Nœud Gaulix PC de crise (kit XIAO S3 + Wio-SX1262 nu).
; Pas d'écran, pas de GPS, pas de bouton UI — client externe USB / Wi-Fi / BLE.
[env:seeed-xiao-s3-gaulix]
extends = env:seeed-xiao-s3
custom_meshtastic_display_name = Gaulix PC Crise (XIAO S3 + SX1262)
custom_meshtastic_tags = Seeed,Gaulix
custom_meshtastic_actively_supported = false
board_level = extra
build_flags =
  ${env:seeed-xiao-s3.build_flags}
  -D GAULIX_PC_NODE=1
  -D HAS_SCREEN=0
  -D HAS_BUTTON=0
  -D HAS_GPS=0
  -D MESHTASTIC_EXCLUDE_SCREEN=1
  -D MESHTASTIC_EXCLUDE_GPS=1
  -D MESHTASTIC_EXCLUDE_INPUTBROKER=1
  -D MESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
  -UUSERPREFS_CONFIG_DEVICE_ROLE
  -DUSERPREFS_CONFIG_DEVICE_ROLE=meshtastic_Config_DeviceConfig_Role_CLIENT
  -UUSERPREFS_CONFIG_DEVICE_REBROADCAST_MODE
  -DUSERPREFS_CONFIG_DEVICE_REBROADCAST_MODE=meshtastic_Config_DeviceConfig_RebroadcastMode_LOCAL_ONLY
  -UUSERPREFS_CONFIG_GPS_MODE
  -DUSERPREFS_CONFIG_GPS_MODE=meshtastic_Config_PositionConfig_GpsMode_DISABLED
